schema: spec-driven

context: |
  Project: Mealie, a self-hosted recipe manager and meal planner (brownfield, upstream open source).
  Base: upstream commit 7fe358e on branch `capstone`.
  Backend: FastAPI + SQLAlchemy + Alembic, Python 3.12, uv. Repository-Service-Controller pattern,
  everything scoped to group/household. SQLite by default, PostgreSQL supported.
  Frontend: Nuxt 3, Vue 3, TypeScript, yarn, Vitest. Node 22 (see .node-version). Source lives directly
  under frontend/ (pages/, components/, composables/, lib/api/, lang/); there is no frontend/app/.
  Generated code (never hand-edit): frontend/lib/api/types/, mealie/schema/*/__init__.py.
  Run `task dev:generate` after changing Pydantic schemas (needs json2ts on PATH).
  Translations: only edit en-US locale files (other locales are managed by Crowdin).
  Validation: `task validate` (enforced) before every commit. See AGENTS.md and docs/agents/.
  Conventional Commits for commit and PR titles.

rules:
  proposal:
    - State which backend and frontend areas change, and whether a DB migration is needed.
    - Include a Non-goals section.
  tasks:
    - Include tasks for tests (pytest and/or vitest) and a visual check in the browser for UI work.
    - Include `task dev:generate` when Pydantic schemas change.
    - Final task is always "run `task validate` and confirm it passes".

operations:
  apply:
    guidance:
      - Run `task validate` before declaring the change done; do not rely on partial test runs.
      - Validate UI changes in the running app (http://localhost:3000) and report what was checked.
  archive:
    guidance:
      - Summarize the archive outcome and which specs were synced before finishing.
